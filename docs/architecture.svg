<svg viewBox="0 0 900 1180" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1180" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">AI-Powered Customer Review Intelligence Platform</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#6b7280">End-to-end pipeline architecture</text>

  <!-- Layer 1 -->
  <rect x="150" y="90" width="600" height="70" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Layer 1 — Data Ingestion</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#0c4a6e">JSON (Amazon) · CSV · Web Scraping (Jumia, Selenium+Cloudflare) · PDF</text>
  <line x1="450" y1="160" x2="450" y2="188" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <rect x="150" y="190" width="600" height="60" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Layer 2 — Preprocessing</text>
  <text x="450" y="235" text-anchor="middle" font-size="12" fill="#0c4a6e">Technical cleaning (HTML, whitespace) + language detection</text>
  <line x1="450" y1="250" x2="450" y2="278" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <rect x="150" y="280" width="600" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Layer 3 — OCR</text>
  <text x="450" y="325" text-anchor="middle" font-size="12" fill="#78350f">Tesseract (benchmark winner vs EasyOCR / PaddleOCR)</text>
  <line x1="450" y1="340" x2="450" y2="368" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Layer 4 -->
  <rect x="150" y="370" width="600" height="70" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="450" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Layer 4 — NLP Analysis</text>
  <text x="450" y="420" text-anchor="middle" font-size="12" fill="#831843">Aspect-based sentiment (product/shipping/service/price) + brand/SKU entity extraction</text>
  <line x1="450" y1="440" x2="450" y2="468" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Layer 5 -->
  <rect x="120" y="470" width="660" height="110" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Layer 5 — RAG Q&amp;A</text>
  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#4c1d95">Multilingual embeddings → ChromaDB index → sentiment-aware retrieval</text>
  <text x="450" y="540" text-anchor="middle" font-size="12" fill="#4c1d95">→ LLM answers ONLY from retrieved reviews → cited sources</text>
  <text x="450" y="562" text-anchor="middle" font-size="11" font-style="italic" fill="#6d28d9">Grounded, never hallucinated — verified via LLM-as-judge</text>
  <line x1="450" y1="580" x2="450" y2="608" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Benchmark LLM -->
  <rect x="150" y="610" width="600" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450" y="635" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">LLM Benchmark</text>
  <text x="450" y="655" text-anchor="middle" font-size="12" fill="#14532d">Groq/LLaMA 3.3 vs Qwen 3.6 vs Mistral — Qwen selected for production</text>
  <line x1="450" y1="670" x2="450" y2="698" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Gradio -->
  <rect x="150" y="700" width="600" height="60" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="450" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Gradio Interface</text>
  <text x="450" y="745" text-anchor="middle" font-size="12" fill="#7c2d12">Question box + markdown-rendered answer + cited source cards</text>
  <line x1="450" y1="760" x2="450" y2="788" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Evaluation -->
  <rect x="150" y="790" width="600" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="815" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Final Evaluation</text>
  <text x="450" y="835" text-anchor="middle" font-size="12" fill="#1e293b">Precision@5 · End-to-end latency · Faithfulness (LLM-as-judge)</text>

  <!-- Legend -->
  <rect x="150" y="900" width="600" height="220" rx="10" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="450" y="928" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Key results</text>
  <text x="180" y="955" font-size="12" fill="#4b5563">• 4 real ingestion sources: 5000 (JSON) + 199 (CSV) + 40 (scraped) + 30 (PDF) reviews</text>
  <text x="180" y="978" font-size="12" fill="#4b5563">• OCR: Tesseract — best score (0.126) AND fastest (3.9s / 15 images)</text>
  <text x="180" y="1001" font-size="12" fill="#4b5563">• LLM: Qwen 3.6 27B — best multilingual nuance, avoids LLaMA 3 deprecation</text>
  <text x="180" y="1024" font-size="12" fill="#4b5563">• RAG: 100% of known-relevant reviews retrieved in top-5, across test set</text>
  <text x="180" y="1047" font-size="12" fill="#4b5563">• Faithfulness: 5/5 PASS (LLM-as-judge) — zero hallucination detected</text>
  <text x="180" y="1070" font-size="12" fill="#4b5563">• Latency: 0.91s average end-to-end (target was &lt;4s)</text>
  <text x="180" y="1093" font-size="12" fill="#4b5563">• Legal &amp; ethical: robots.txt + ToS verified before every scraping target</text>

  <text x="450" y="1160" text-anchor="middle" font-size="11" fill="#9ca3af">Built layer-by-layer, each validated on real data before moving forward</text>
</svg>
